  </defs>

  <!-- K Icon -->
  <g transform="translate(10, 0)">
    <path d="M 22 15 L 42 15 L 42 105 L 22 105 Z" fill="#0A0F1D"/>
    <path d="M 22 56 L 88 15 L 105 15 L 38 67 Z" fill="url(#logoLightGrad)"/>
    <path d="M 42 66 L 98 105 L 76 105 L 32 73 Z" fill="#0A0F1D"/>
  </g>

  <!-- Vertical Divider -->
  <line x1="145" y1="20" x2="145" y2="100" stroke="#0077FF" stroke-width="2" stroke-linecap="round"/>

  <!-- Wordmark -->
