    <text x="36" y="55" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="800" font-size="42" letter-spacing="8" fill="url(#logoLightGrad)">Λ</text>
    <text x="74" y="55" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="800" font-size="42" letter-spacing="8" fill="#0A0F1D">IZEN</text>

