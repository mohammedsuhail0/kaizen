<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="sealGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer Rounded Stamp -->
  <rect x="8" y="8" width="144" height="144" rx="28" fill="#070C14" stroke="#00F5FF" stroke-width="4" filter="url(#sealGlow)"/>
  <rect x="14" y="14" width="132" height="132" rx="22" fill="none" stroke="rgba(0, 245, 255, 0.4)" stroke-width="1.5"/>
  <!-- Kanji text: 改善 -->
  <text x="80" y="70" text-anchor="middle" font-family="'Noto Serif JP', serif" font-weight="900" font-size="52" fill="#00F5FF" filter="url(#sealGlow)">改</text>
  <text x="80" y="122" text-anchor="middle" font-family="'Noto Serif JP', serif" font-weight="900" font-size="52" fill="#00F5FF" filter="url(#sealGlow)">善</text>
</svg>
