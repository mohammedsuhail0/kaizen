<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#00C8FF"/>
      <stop offset="100%" stop-color="#0077FF"/>
    </linearGradient>
    <filter id="sealGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer Rounded Stamp -->
  <rect x="8" y="8" width="144" height="144" rx="28" fill="#070C14" stroke="#00F5FF" stroke-width="4" filter="url(#sealGlow)"/>
  <rect x="14" y="14" width="132" height="132" rx="22" fill="none" stroke="rgba(0, 245, 255, 0.4)" stroke-width="1.5"/>
  <!-- Official K Logo Mark (English / Geometric Only) -->
  <g transform="translate(20, 20) scale(1)">
    <path d="M 22 15 L 42 15 L 42 105 L 22 105 Z" fill="#FFFFFF"/>
    <path d="M 22 56 L 88 15 L 105 15 L 38 67 Z" fill="url(#sealGrad)" filter="url(#sealGlow)"/>
    <path d="M 42 66 L 98 105 L 76 105 L 32 73 Z" fill="#FFFFFF"/>
  </g>
</svg>
