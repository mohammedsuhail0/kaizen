<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120">
  <defs>
    <linearGradient id="logoDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#00C8FF"/>
      <stop offset="100%" stop-color="#0077FF"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- K Icon -->
  <g transform="translate(10, 0)" filter="url(#logoGlow)">
    <path d="M 22 15 L 42 15 L 42 105 L 22 105 Z" fill="#FFFFFF"/>
    <path d="M 22 56 L 88 15 L 105 15 L 38 67 Z" fill="url(#logoDarkGrad)"/>
    <path d="M 42 66 L 98 105 L 76 105 L 32 73 Z" fill="#FFFFFF"/>
  </g>

  <!-- Vertical Divider -->
  <line x1="145" y1="20" x2="145" y2="100" stroke="url(#logoDarkGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Wordmark -->
  <g transform="translate(170, 0)">
    <!-- KAIZEN -->
    <text x="0" y="55" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="800" font-size="42" letter-spacing="8" fill="#FFFFFF">K</text>
    <text x="36" y="55" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="800" font-size="42" letter-spacing="8" fill="url(#logoDarkGrad)" filter="url(#logoGlow)">Λ</text>
    <text x="74" y="55" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="800" font-size="42" letter-spacing="8" fill="#FFFFFF">IZEN</text>

    <!-- Subtitle -->
    <text x="2" y="76" font-family="'JetBrains Mono', Consolas, monospace" font-weight="700" font-size="12" letter-spacing="5" fill="#94A3B8">SOFTWARE AGENCY</text>

    <!-- Glowing Accent Rule -->
    <line x1="2" y1="86" x2="260" y2="86" stroke="url(#logoDarkGrad)" stroke-width="1.5"/>

    <!-- Tagline -->
    <text x="2" y="99" font-family="'JetBrains Mono', Consolas, monospace" font-weight="600" font-size="9" letter-spacing="3" fill="#64748B">IDEAS TODAY, A BETTER TOMORROW.</text>
  </g>
</svg>
